<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fonts.conf - fontconfig on Burrow (W16): the DejaVu fonts on the X disk,
     a cache in /tmp (the X disk is not written to), and the generic names
     programs ask for. /opt/x11/etc/fonts/fonts.conf; FONTCONFIG_FILE in
     x11.env points here. Docs: docs/04-plan/waves/WAVE-16-x11-desktop.md. -->
<fontconfig>
  <dir>/opt/x11/fonts/ttf</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
